[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "impacttest"
version = "0.1.0"
description = "Static test-impact analyzer for Python + pytest."
requires-python = ">=3.10"
dependencies = [
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
impacttest = "impacttest.cli:main"

[tool.setuptools.packages.find]
include = ["impacttest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.impacttest]
# "." because this repo is a flat layout: impacttest/ sits directly under
# the repo root, so "impacttest/cli.py" must resolve to "impacttest.cli"
# (the real import name), not "cli". A src/ layout would use ["src"] here.
source_roots = ["."]
test_roots = ["tests"]
base_branch = "main"
